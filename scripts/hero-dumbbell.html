<!doctype html>
<!--
  Source for public/hero-dumbbell.webp — the hero's weight.

  There is no 3D model file behind the hero object and no modelling tool in
  this project: the dumbbell is built here out of primitives (a lathed plate
  profile, cylinders for the shaft and collars) and lit by a procedural
  studio environment, then rendered once to a transparent WebP that ships as
  a plain image. The page itself never loads three.js.

  To change it: open this file in a browser, edit the numbers below, reload,
  and press the download button; drop the result in public/. If you change
  SIZE, update HERO_OBJECT in src/frontend/site/photos.ts to match.

  Everything renders *lighter* than the olive ground on purpose — on phones
  HeroObject draws at 0.22 opacity, where anything darker than the page
  simply disappears.
-->
<meta charset="utf-8" />
<title>hero dumbbell — render source</title>
<style>
  html,body{margin:0;background:#16281b;display:grid;place-items:center;height:100%}
  canvas{width:min(70vmin,520px);height:min(70vmin,520px)}
  button{position:fixed;bottom:24px;left:50%;translate:-50% 0;font:inherit;
    padding:10px 18px;border:1px solid #97b08c;background:#1e3324;color:#ecefe8;cursor:pointer}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  const SIZE = 1024;

  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true,
    preserveDrawingBuffer: true,
  });
  renderer.setPixelRatio(1);
  renderer.setSize(SIZE, SIZE, false);
  renderer.setClearAlpha(0);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  addEventListener("DOMContentLoaded", () =>
    document.body.appendChild(renderer.domElement));

  const scene = new THREE.Scene();

  /* ── Environment: a procedural equirect gradient so the metal has
        something to reflect. Without it, metalness renders black. ── */
  function envTexture() {
    const c = document.createElement("canvas");
    c.width = 1024; c.height = 512;
    const g = c.getContext("2d");

    // A dark room. Chrome only looks like chrome when most of what it
    // reflects is *black* and the bright parts have hard edges — a smooth
    // gradient all round is what makes metal render as matte clay.
    const sky = g.createLinearGradient(0, 0, 0, 512);
    sky.addColorStop(0.00, "#2b332a");
    sky.addColorStop(0.48, "#131a13");
    sky.addColorStop(0.52, "#0b100c"); // horizon break
    sky.addColorStop(1.00, "#040604"); // floor
    g.fillStyle = sky;
    g.fillRect(0, 0, 1024, 512);

    // Softboxes: hard-edged bright panels. These are the streaks that will
    // travel across the plate rims and read as polished steel.
    const box = (x, y, w, h, c) => {
      g.save();
      g.filter = "blur(6px)";
      g.fillStyle = c;
      g.fillRect(x, y, w, h);
      g.restore();
    };
    box(150, 40, 420, 120, "#ffffff");   // big key panel, upper left
    box(150, 185, 420, 26, "#c8d6c0");   // its lower edge strip
    box(700, 70, 120, 300, "#eef3e8");   // tall side panel
    box(880, 150, 46, 190, "#97b08c");   // sage kicker — the brand colour
    box(0, 250, 1024, 8, "#7f8f78");     // horizon line

    // Dim sage bounce from the floor, matching the hero's ground light.
    const bounce = g.createRadialGradient(760, 430, 10, 760, 430, 300);
    bounce.addColorStop(0, "rgba(151,176,140,0.40)");
    bounce.addColorStop(1, "rgba(151,176,140,0)");
    g.fillStyle = bounce;
    g.fillRect(0, 0, 1024, 512);

    const t = new THREE.CanvasTexture(c);
    t.mapping = THREE.EquirectangularReflectionMapping;
    t.encoding = THREE.sRGBEncoding;
    return t;
  }

  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  scene.environment = pmrem.fromEquirectangular(envTexture()).texture;

  /* ── Knurl: a crosshatch roughness map for the grip. ── */
  function knurlMap() {
    const c = document.createElement("canvas");
    c.width = 128; c.height = 128;
    const g = c.getContext("2d");
    g.fillStyle = "#6a6a6a";
    g.fillRect(0, 0, 128, 128);
    g.strokeStyle = "#d8d8d8";
    g.lineWidth = 3;
    for (let i = -128; i < 256; i += 10) {
      g.beginPath(); g.moveTo(i, 0); g.lineTo(i + 128, 128); g.stroke();
      g.beginPath(); g.moveTo(i, 128); g.lineTo(i + 128, 0); g.stroke();
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(26, 1);
    return t;
  }

  /* ── Materials ── */
  /*
    Everything stays *lighter* than the olive ground on purpose: on phones the
    layer renders at 0.22 opacity, so any pixel darker than the background
    simply disappears. Form comes from specular contrast, not from dark values.
  */
  const steel = new THREE.MeshStandardMaterial({
    color: 0xdfe6da, metalness: 0.92, roughness: 0.15, envMapIntensity: 2.0,
  });
  const grip = new THREE.MeshStandardMaterial({
    color: 0xb9c2b3, metalness: 0.70, roughness: 0.55,
    roughnessMap: knurlMap(), envMapIntensity: 1.6,
  });
  const plateMat = new THREE.MeshStandardMaterial({
    color: 0xa9b6a2, metalness: 0.80, roughness: 0.25, envMapIntensity: 1.9,
    flatShading: true,
  });
  const collarMat = new THREE.MeshStandardMaterial({
    color: 0xf0f4ea, metalness: 0.95, roughness: 0.08, envMapIntensity: 2.2,
  });

  /*
    A weight plate, drawn as a lathe profile rather than a disc: raised hub at
    the bore, a dished web, then a chamfered rim. That stepped silhouette is
    most of what makes it read as a cast plate instead of a washer, and it is
    what catches the three different highlights across one face.

    Profile runs bore → outer face → around the rim → back to the bore.
  */
  function plate(radius, thickness, bore) {
    const c = 0.055;                       // rim chamfer
    const h = thickness / 2;               // rim half-thickness
    const w = h * 0.62;                    // web — recessed from the rim
    const b = h * 1.3;                     // hub — proud of it
    const hub = bore + 0.17;
    const web = radius - 0.28;
    const v = (x, y) => new THREE.Vector2(x, y);

    const pts = [
      v(bore, -b), v(hub, -b), v(hub, -w), v(web, -w), v(web, -h),
      v(radius - c * 2.4, -h), v(radius - c, -h + c * 0.4),
      v(radius, -h + c * 1.5),
      v(radius, h - c * 1.5),
      v(radius - c, h - c * 0.4), v(radius - c * 2.4, h),
      v(web, h), v(web, w), v(hub, w), v(hub, b), v(bore, b),
    ];

    const m = new THREE.Mesh(new THREE.LatheGeometry(pts, 96), plateMat);
    m.rotation.z = Math.PI / 2;            // lay the axis along X
    return m;
  }

  function cyl(r, len, mat, seg = 64) {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, seg), mat);
    m.rotation.z = Math.PI / 2;
    return m;
  }

  /* ── The dumbbell ── */
  const bell = new THREE.Group();

  // Handle: a plain shaft with a knurled grip over its middle.
  bell.add(cyl(0.2, 3.9, steel));
  const g1 = cyl(0.215, 1.9, grip);
  g1.rotation.y = Math.PI / 2;             // run the knurl around the shaft
  bell.add(g1);

  // Per side: inner collar, three plates stepping down, end nut.
  for (const s of [1, -1]) {
    const collar = cyl(0.36, 0.2, collarMat);
    collar.position.x = s * 1.32;
    bell.add(collar);

    const stack = [
      [1.08, 0.30, 1.60],
      [0.86, 0.26, 1.97],
      [0.63, 0.24, 2.28],
    ];
    for (const [r, t, x] of stack) {
      const p = plate(r, t, 0.2);
      p.position.x = s * x;
      bell.add(p);
    }

    const nut = cyl(0.3, 0.18, collarMat);
    nut.position.x = s * 2.4;
    bell.add(nut);
  }

  // Three-quarter view: tipped off the horizontal so it reads as an object
  // in space rather than an icon, and turned so one plate face catches light.
  bell.rotation.set(0.1, 0.42, -0.3);
  scene.add(bell);

  /* ── Lights on top of the environment ── */
  const key = new THREE.DirectionalLight(0xf6f9f0, 0.55);
  key.position.set(-3.5, 5, 4);
  scene.add(key);

  const rim = new THREE.DirectionalLight(0x97b08c, 1.1);
  rim.position.set(4, -2.5, -3);
  scene.add(rim);

  const fill = new THREE.DirectionalLight(0x9fb597, 0.12);
  fill.position.set(2, 1, 5);
  scene.add(fill);

  /* ── Camera ── */
  const cam = new THREE.PerspectiveCamera(26, 1, 0.1, 100);
  cam.position.set(0, 0.55, 10.4);
  cam.lookAt(0, 0, 0);

  renderer.render(scene, cam);

  // Save. Opening this file straight off disk is enough — no server, no
  // build step; the button writes the exact bytes that live in public/.
  addEventListener("DOMContentLoaded", () => {
    const b = document.createElement("button");
    b.textContent = "Download hero-dumbbell.webp";
    b.onclick = () => {
      const a = document.createElement("a");
      a.download = "hero-dumbbell.webp";
      a.href = renderer.domElement.toDataURL("image/webp", 0.92);
      a.click();
    };
    document.body.appendChild(b);
  });
</script>
